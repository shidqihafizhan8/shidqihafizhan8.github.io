<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nya-Weed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: customer site = sticky top bar + 1080px column (bottom tab bar on phones); admin = dark sidebar + content (tab strip on phones). */
:root{
  --bg:#F1F5EC; --surface:#FFFFFF; --surface2:#E7EEE1; --fg:#15241B; --muted:#58695D; --line:#D3DDCC;
  --accent:#2F6B3A; --accent-fg:#FFFFFF; --accent-soft:#DCE9D5;
  --berry:#B83B6B; --berry-soft:#F7E3EB;
  --ok:#2B7A47; --ok-soft:#DDEFE2; --warn:#8A5A06; --warn-soft:#F6EBD0; --bad:#B3342F; --bad-soft:#F8E1DF;
  --side:#14261A; --side-fg:#E6EFE3; --side-on:#274532;
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1610; --surface:#17221A; --surface2:#203024; --fg:#E8F0E6; --muted:#9DB0A2; --line:#2B3C30;
  --accent:#8CC97A; --accent-fg:#0E1610; --accent-soft:#223829;
  --berry:#F08AAE; --berry-soft:#3A1E2A;
  --ok:#7FD19A; --ok-soft:#1B3324; --warn:#E6B65A; --warn-soft:#3A2D12; --bad:#F0908A; --bad-soft:#3C1F1E;
  --side:#0A110C; --side-fg:#E6EFE3; --side-on:#1F3626; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1610; --surface:#17221A; --surface2:#203024; --fg:#E8F0E6; --muted:#9DB0A2; --line:#2B3C30;
  --accent:#8CC97A; --accent-fg:#0E1610; --accent-soft:#223829;
  --berry:#F08AAE; --berry-soft:#3A1E2A;
  --ok:#7FD19A; --ok-soft:#1B3324; --warn:#E6B65A; --warn-soft:#3A2D12; --bad:#F0908A; --bad-soft:#3C1F1E;
  --side:#0A110C; --side-fg:#E6EFE3; --side-on:#1F3626; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--font-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{flex:none}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono)}
.muted{color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);border-radius:12px;padding:11px 18px;font-weight:600;min-height:44px;text-decoration:none}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.iconbtn:hover{border-color:var(--accent)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600}
.input,select.input,textarea.input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;min-height:44px}
.input:focus{border-color:var(--accent);outline:none}
.err{color:var(--bad);font-size:13px}
.hint{color:var(--muted);font-size:13px}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.card.flat{background:var(--surface2);border-color:transparent}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.badge.berry{background:var(--berry-soft);color:var(--berry)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 16px;font-weight:600;white-space:nowrap;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* art tile */
.tile{--tone:#8B5E3C;background:color-mix(in srgb,var(--tone) 16%,var(--surface));display:flex;align-items:center;justify-content:center;border-radius:14px;color:var(--fg)}
.tile svg{width:78%;height:78%}
.tile.photo{position:relative;overflow:hidden;background:var(--surface2)}
.tile.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.tile.big{aspect-ratio:1;width:100%}
.hero .art img{width:100%;height:100%;object-fit:cover;border-radius:22px;display:block}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:60px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0;font-family:var(--font-display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.nav{display:flex;gap:4px;margin-left:12px}
.nav button{background:none;border:0;padding:8px 12px;border-radius:9px;font-weight:600;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--fg);background:var(--surface2)}
.cartbtn{position:relative;margin-left:auto}
.cartbtn .dot{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:99px;background:var(--berry);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
.bottom{display:none}
@media (max-width:720px){
  .nav{display:none}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottom button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--muted)}
  .bottom button[aria-current="page"]{color:var(--accent)}
  .cust{padding-bottom:76px}
}

/* sections */
.page{padding-block:24px 40px}
.sec{margin-top:36px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:24px}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;background:var(--accent-soft);border-radius:24px;padding:36px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800}
.hero .kick{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--accent);margin-bottom:10px}
.hero .art{aspect-ratio:1;max-width:300px;justify-self:center;width:100%}
.hero .art svg{width:100%;height:100%}
.search{display:flex;gap:8px;margin-top:20px}
.search .input{flex:1;min-width:0}
@media (max-width:720px){.hero{grid-template-columns:1fr;padding:22px}.hero .art{max-width:190px;order:-1}}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pcard{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;min-width:0}
.pcard:hover{border-color:var(--accent)}
.pcard .tile{aspect-ratio:4/3}
.pcard h3{font-size:17px}
.pcard .meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-weight:700}
.price s{color:var(--muted);font-weight:500;margin-right:6px;font-size:13px}
.addbtn{width:36px;height:36px;border-radius:99px;border:0;background:var(--accent);color:var(--accent-fg);display:inline-flex;align-items:center;justify-content:center}
.addbtn[disabled]{background:var(--surface2);color:var(--muted);cursor:not-allowed}
.promo{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.promo .pct{font-family:var(--font-display);font-weight:800;font-size:34px;color:var(--berry);min-width:84px;line-height:1}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.two.even{grid-template-columns:1fr 1fr}
@media (max-width:820px){.two,.two.even{grid-template-columns:1fr}}
.sticky{position:sticky;top:76px}
@media (max-width:820px){.sticky{position:static}}
.line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line .tile{width:64px;height:64px;flex:none}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;background:var(--surface)}
.qty button{width:34px;height:34px;background:none;border:0;display:flex;align-items:center;justify-content:center}
.qty span{min-width:28px;text-align:center;font-weight:700}
.sum{display:flex;justify-content:space-between;gap:12px;padding:5px 0}
.sum.total{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.radio{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:12px 14px;cursor:pointer}
.radio:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.radio input{accent-color:var(--accent);width:18px;height:18px;flex:none}
.mark{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
details{border-top:1px solid var(--line);padding:12px 0}
summary{cursor:pointer;font-weight:600}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:11px;padding:10px 12px;font-size:13px;font-weight:600}
.infobox{background:var(--surface2);border-radius:11px;padding:10px 12px;font-size:13px;color:var(--muted)}

/* status */
.statuswrap{max-width:520px;margin:0 auto;text-align:center}
.bigicon{width:64px;height:64px;border-radius:99px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.bigicon.ok{background:var(--accent);color:var(--accent-fg)}
.bigicon.warn{background:var(--warn-soft);color:var(--warn)}
.bigicon.bad{background:var(--bad-soft);color:var(--bad)}
.tl{list-style:none;padding:0;margin:14px 0 0;text-align:left}
.tl li{display:flex;gap:12px;position:relative;padding-bottom:18px}
.tl li:last-child{padding-bottom:0}
.tl li::before{content:"";position:absolute;left:7px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .pt{width:16px;height:16px;border-radius:99px;border:2px solid var(--line);background:var(--surface);flex:none;margin-top:3px}
.tl li.done .pt{background:var(--accent);border-color:var(--accent)}
.tl li.done::before{background:var(--accent)}
.spin{width:46px;height:46px;border-radius:99px;border:4px solid var(--line);border-top-color:var(--accent);margin:0 auto 16px;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* footer */
.foot{margin-top:48px;border-top:1px solid var(--line);padding-block:28px 20px;color:var(--muted);font-size:14px}
.foot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:20px}
@media (max-width:720px){.foot .cols{grid-template-columns:1fr 1fr}}
.foot h4{margin:0 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg)}
.foot button{display:block;background:none;border:0;padding:3px 0;color:var(--muted);text-align:left}
.foot button:hover{color:var(--fg)}

/* admin */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.side .logo{color:var(--side-fg);padding:4px 10px 16px}
.side button.nv{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--side-fg);opacity:.78;padding:10px 12px;border-radius:10px;text-align:left;font-weight:600}
.side button.nv:hover{opacity:1}
.side button.nv[aria-current="page"]{background:var(--side-on);opacity:1}
.side .sp{flex:1}
.main{padding:24px;min-width:0}
.main h1{font-size:28px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;margin-top:4px}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:600px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .tile{width:44px;height:44px;border-radius:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tab{border:0;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bar{fill:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.chart .bar.now{fill:var(--accent)}
.chart text.val{fill:var(--fg);font-weight:700}
@media (max-width:820px){
  .adm{grid-template-columns:1fr}
  .side{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;overflow-x:auto;padding:8px;z-index:20;align-items:center}
  .side .logo{display:none}
  .side button.nv{white-space:nowrap;padding:8px 12px}
  .side .sp{display:none}
  .main{padding:16px}
}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .card{width:100%;max-width:380px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(8,14,10,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:18px;border:1px solid var(--line);width:100%;max-width:520px;padding:20px;margin-block:auto}
.modal h2{font-size:22px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.cols2{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:721px){#toast{bottom:28px}}
</style>

<div id="app"></div>

};
function ic(n,s){s=s||20;return '<svg class="ic" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>';}
var LOGO='<svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 15L6 3l8 6.5zM28 15l-2-12-8 6.5z" fill="var(--accent)"/><circle cx="16" cy="19" r="11" fill="var(--accent)"/><path d="M16 28c-6-3-7-9-1.5-13.5 1 3.2 4 4.4 7 4.2C21.4 23.5 19.5 26.4 16 28z" fill="var(--accent-fg)"/></svg>';

/* ---------- logic ---------- */
function item(id){return S.menu.filter(function(m){return m.id===id;})[0];}
function matches(p,it){
  if(p.target==='all')return true;
  if(p.target.indexOf('cat:')===0)return it.cat===p.target.slice(4);
  if(p.target.indexOf('item:')===0)return it.id===+p.target.slice(5);
  return false;
}
function activePromos(it){return S.promos.filter(function(p){return p.active&&matches(p,it);});}
function lineDisc(it,qty){
  var best=0;
  activePromos(it).forEach(function(p){
    var d=0;
    if(p.type==='pct')d=Math.round(it.price*qty*p.pct/100);
    else if(p.type==='b1g1')d=Math.floor(qty/2)*it.price;
    if(d>best)best=d;
  });
  return best;
}
function tagFor(it){
  var ps=activePromos(it);if(!ps.length)return null;
  var pct=ps.filter(function(p){return p.type==='pct';}).sort(function(a,b){return b.pct-a.pct;})[0];
  if(pct)return '-'+pct.pct+'%';
  return 'Beli 1 Gratis 1';
}
function unitPrice(it){
  var ps=activePromos(it).filter(function(p){return p.type==='pct';});
  if(!ps.length)return null;
  var mx=Math.max.apply(null,ps.map(function(p){return p.pct;}));
  return Math.round(it.price*(100-mx)/100);
}
function cartCalc(delivery){
  var lines=[],sub=0,disc=0;
  S.cart.forEach(function(c){
    var it=item(c.id);if(!it)return;
    var s=it.price*c.qty,d=lineDisc(it,c.qty),issue=null;
    if(it.stock<=0)issue='habis';else if(c.qty>it.stock)issue='stok';
    lines.push({item:it,qty:c.qty,sub:s,disc:d,issue:issue});
    sub+=s;disc+=d;
  });
  var fee=(delivery&&lines.length&&S.settings.delivery)?+S.settings.fee:0;
  return {lines:lines,subtotal:sub,discount:disc,fee:fee,total:sub-disc+fee};
}
function addToCart(id,n){
  var it=item(id);if(!it)return false;
  if(it.stock<=0){toast(it.name+' sedang habis.');return false;}
  var c=S.cart.filter(function(x){return x.id===id;})[0];
  var cur=c?c.qty:0;
  if(cur+n>it.stock){toast('Stok '+it.name+' tersisa '+it.stock+'.');return false;}
  if(c)c.qty+=n;else S.cart.push({id:id,qty:n});
  save();return true;
}
function settlePaid(o){
  o.pay.status='Berhasil';o.status='Diproses';
  var t=Date.now();o.log.paid=t;o.log.Diproses=t+1000;
  o.items.forEach(function(i){var m=item(i.id);if(m)m.stock=Math.max(0,m.stock-i.qty);});
  if(S.draftId===o.id){S.cart=[];S.draftId=null;}
}

  var bad=c.lines.some(function(l){return l.issue;});
  var rows=c.lines.map(function(l){
    var it=l.item;
    var warn=l.issue==='habis'?'<div class="warnbox" style="margin-top:6px">Produk habis. Hapus dari keranjang atau pilih produk lain.</div>':
      l.issue==='stok'?'<div class="warnbox" style="margin-top:6px">Stok tersisa '+it.stock+'. <button class="linkbtn" data-act="fixQty" data-id="'+it.id+'">Sesuaikan jumlah</button></div>':'';
    return '<div class="line"><div style="display:contents">'+tile(it)+'</div><div class="grow"><b>'+esc(it.name)+'</b><div class="muted num">'+fmt(it.price)+(l.disc?' · hemat '+fmt(l.disc):'')+'</div>'+warn+'</div>'+
     '<div class="qty"><button data-act="cq" data-id="'+it.id+'" data-d="-1" aria-label="Kurangi">'+ic('minus',16)+'</button><span class="num">'+l.qty+'</span><button data-act="cq" data-id="'+it.id+'" data-d="1" aria-label="Tambah">'+ic('plus',16)+'</button></div>'+
     '<button class="iconbtn" data-act="del" data-id="'+it.id+'" aria-label="Hapus '+esc(it.name)+'">'+ic('trash',18)+'</button></div>';

   '<div class="card sticky">'+sumHTML(c,false)+'<div class="stack" style="margin-top:14px;gap:10px"><button class="btn block" data-act="toCheckout"'+(bad?' disabled':'')+'>Checkout</button><button class="btn ghost block" data-act="go" data-v="menu">Tambah Menu Lain</button>'+(bad?'<p class="err">Perbaiki produk bermasalah dulu untuk lanjut.</p>':'')+'</div></div></div>';

function statusView(){
  var o=S.orders.filter(function(x){return x.id===S.viewOrderId;})[0];
  if(!o)return trackView();
  var ps=o.pay.status,ok=ps==='Berhasil';
  var head=ok?'<div class="bigicon ok">'+ic('check',32)+'</div><h1 style="font-size:28px">Pesanan Berhasil!</h1><p class="muted">Pesanan Anda telah diterima.</p>':
    ps==='Pending'?'<div class="bigicon warn">'+ic('clock',30)+'</div><h1 style="font-size:28px">Menunggu Pembayaran</h1><p class="muted">Pesanan belum dibayar. Jika sudah membayar, status akan diperbarui otomatis oleh penyedia pembayaran.</p>':
    '<div class="bigicon bad">'+ic('close',30)+'</div><h1 style="font-size:28px">Pembayaran Gagal</h1><p class="muted">Pembayaran tidak dapat diproses. Anda bisa mencoba lagi dengan metode yang sama atau berbeda.</p>';
  var tl='';
  if(ok){
    var firstOpen=true;
    tl='<ul class="tl">'+steps(o).map(function(s){
      var t=o.log[s.k],done=!!t;
      var extra=done?fmtT(t):(firstOpen?'Sedang berjalan':'');
      if(!done)firstOpen=false;
      return '<li class="'+(done?'done':'')+'"><span class="pt"></span><div><b>'+s.t+'</b><div class="hint">'+extra+'</div></div></li>';
    }).join('')+'</ul>';
  }
  var detail=S.showDetail?'<div style="margin-top:12px;text-align:left;border-top:1px solid var(--line);padding-top:10px">'+
    o.items.map(function(i){return '<div class="sum"><span>'+esc(i.name)+' x'+i.qty+'</span><span class="num">'+fmt(i.price*i.qty)+'</span></div>';}).join('')+
    (o.discount?'<div class="sum"><span class="muted">Diskon</span><span class="num">-'+fmt(o.discount)+'</span></div>':'')+
    (o.fee?'<div class="sum"><span class="muted">Ongkos kirim</span><span class="num">'+fmt(o.fee)+'</span></div>':'')+
    '<p class="hint" style="margin-top:8px">'+(o.method==='pickup'?'Pickup di cafe':'Delivery ke '+esc(o.addr))+' · atas nama '+esc(o.name)+'</p></div>':'';
  return '<div class="statuswrap"><div class="card" style="padding:28px 20px">'+head+
   '<div style="margin-top:18px;text-align:left"><div class="sum"><span class="muted">Nomor Pesanan</span><span class="mono">#'+o.id+'</span></div><div class="sum"><span class="muted">Metode</span><span>'+esc(o.pay.method||'-')+'</span></div><div class="sum"><span class="muted">Total Pembayaran</span><b class="num">'+fmt(o.total)+'</b></div></div>'+
   tl+detail+'</div>'+
   '<div class="stack" style="margin-top:14px;gap:10px">'+
   (ok?'<button class="btn block" data-act="toggleDetail">'+(S.showDetail?'Sembunyikan Detail Pesanan':'Lihat Detail Pesanan')+'</button>':'<button class="btn block" data-act="retryPay">Coba Bayar Lagi</button>')+
   '<button class="btn ghost block" data-act="go" data-v="'+(ok?'home':'menu')+'">'+(ok?'Kembali ke Beranda':'Kembali ke Menu')+'</button></div></div>';
}

function tabs(list,cur,act){return '<div class="tabs">'+list.map(function(t){return '<button class="tab" data-act="'+act+'" data-v="'+esc(t[0])+'" aria-pressed="'+(cur===t[0])+'">'+t[1]+'</button>';}).join('')+'</div>';}
function chartHTML(){
  var days=[],i;
  for(i=6;i>=0;i--){var d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-i);days.push({k:d.toDateString(),l:d.toLocaleDateString('id-ID',{weekday:'short'}),v:0});}
  S.orders.forEach(function(o){if(o.pay.status!=='Berhasil')return;var k=dayKey(o.ts);days.forEach(function(d){if(d.k===k)d.v+=o.total;});});
  var mx=Math.max.apply(null,days.map(function(d){return d.v;}).concat([1])),steps_=[25000,50000,100000,200000,250000,500000,1000000],st=steps_[steps_.length-1];
  for(i=0;i<steps_.length;i++){if(mx/steps_[i]<=4){st=steps_[i];break;}}
  var top=Math.ceil(mx/st)*st,W=640,H=230,L=48,B=28,T=18,R=10,cw=(W-L-R)/7,ch=H-B-T;
  var g='';
  for(var t=0;t<=top;t+=st){var y=T+ch-(t/top)*ch;g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(t?short(t):'0')+'</text>';}
  days.forEach(function(d,n){
    var h=(d.v/top)*ch,x=L+n*cw+cw*.2,w=cw*.6,y=T+ch-h,now=n===6;
    g+='<rect class="bar'+(now?' now':'')+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+Math.max(h,0)+'" rx="4"/>';
    g+='<text x="'+(x+w/2)+'" y="'+(H-8)+'" text-anchor="middle">'+d.l+'</text>';
    if(now&&d.v)g+='<text class="val" x="'+(x+w/2)+'" y="'+(y-6)+'" text-anchor="middle">'+short(d.v)+'</text>';
  });
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Pendapatan 7 hari terakhir dalam rupiah">'+g+'</svg>';
}
function dashView(){
  var k=dayKey(Date.now());
  var today=S.orders.filter(function(o){return dayKey(o.ts)===k;});
  var paid=today.filter(function(o){return o.pay.status==='Berhasil';});
  var rev=paid.reduce(function(s,o){return s+o.total;},0);
  var proc=S.orders.filter(function(o){return o.status==='Diproses';}).length;
  var pend=S.orders.filter(function(o){return o.pay.status==='Pending';}).length;
  var low=S.menu.filter(function(m){return m.stock<=3;});
  var recent=S.orders.slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,5);
  return '<div class="stack" style="gap:20px"><div><h1>Dashboard</h1><p class="muted">Ringkasan hari ini</p></div>'+
   '<div class="stats"><div class="stat"><span class="eyebrow">Pesanan hari ini</span><b class="num">'+today.length+'</b></div><div class="stat"><span class="eyebrow">Pendapatan hari ini</span><b class="num">'+fmt(rev)+'</b></div><div class="stat"><span class="eyebrow">Perlu diproses</span><b class="num">'+proc+'</b></div><div class="stat"><span class="eyebrow">Pembayaran pending</span><b class="num">'+pend+'</b></div></div>'+
   (low.length?'<div class="warnbox">Stok menipis: '+low.map(function(m){return esc(m.name)+' ('+m.stock+')';}).join(', ')+'</div>':'')+
   '<div class="card"><div class="row between" style="margin-bottom:8px"><h2 style="font-size:18px">Pendapatan 7 Hari Terakhir</h2><span class="hint">Hanya pembayaran berhasil</span></div>'+chartHTML()+'</div>'+
   '<div><div class="row between" style="margin-bottom:10px"><h2 style="font-size:18px">Pesanan Terbaru</h2><button class="linkbtn" data-act="aview" data-v="orders">Lihat Semua</button></div>'+
   '<div class="tbl"><table><thead><tr><th>No.</th><th>Waktu</th><th>Total</th><th>Status</th></tr></thead><tbody>'+recent.map(function(o){return '<tr><td class="mono">#'+o.id+'</td><td class="num">'+fmtT(o.ts)+'</td><td class="num">'+fmt(o.total)+'</td><td><span class="badge '+stClass(o)+'">'+stLabel(o)+'</span></td></tr>';}).join('')+'</tbody></table></div></div></div>';
}

/* ---------- events ---------- */
function setPath(path,val){var p=path.split('.'),o=S;for(var i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=val;}
function validateCheckout(){
  var e={},co=S.co;
  if(!co.name.trim())e.name='Nama wajib diisi.';
  if(co.phone.replace(/\D/g,'').length<9)e.phone='Masukkan nomor HP yang valid (minimal 9 digit).';
  if(co.method==='delivery'&&co.addr.trim().length<8)e.addr='Alamat pengiriman wajib diisi lengkap.';
  S.errs=e;return !Object.keys(e).length;
}
function finishPay(){
  if(S.view!=='verify')return;
  var c=cartCalc(S.co.method==='delivery');
  if(!c.lines.length||c.lines.some(function(l){return l.issue;})){go('cart');toast('Ada produk yang perlu diperiksa.');return;}
  var m=PAYM.filter(function(x){return x.k===S.pay.method;})[0];
  var o=S.draftId&&S.orders.filter(function(x){return x.id===S.draftId;})[0];
  if(!o){o={id:S.seq++,ts:Date.now(),log:{},status:'Belum Dibayar',pay:{trx:'TRX'+(S.trx++)}};S.orders.unshift(o);}
  Object.assign(o,{name:S.co.name.trim(),phone:S.co.phone.trim(),method:S.co.method,addr:S.co.method==='delivery'?S.co.addr.trim():'',notes:S.co.notes.trim(),
    items:c.lines.map(function(l){return {id:l.item.id,name:l.item.name,price:l.item.price,qty:l.qty};}),subtotal:c.subtotal,discount:c.discount,fee:c.fee,total:c.total});
  o.pay.method=m.n;S.viewOrderId=o.id;
  var r=S.pay.sim;
  if(r==='success'){S.draftId=o.id;settlePaid(o);}
  else{o.pay.status=r==='pending'?'Pending':'Gagal';o.status='Belum Dibayar';S.draftId=o.id;}
  save();S.showDetail=false;go('status');
}
function openMenuForm(id){
  var m=id&&item(id);S.editId=id||null;S.formErr='';
  S.form=m?{name:m.name,cat:m.cat,tone:m.tone||'#8B5E3C',price:m.price,stock:m.stock,desc:m.desc}:{name:'',cat:'Coffee',tone:'#8B5E3C',price:'',stock:'',desc:''};
  S.modal='menu';render();
}
function openPromoForm(id){
  var p=id&&S.promos.filter(function(x){return x.id===id;})[0];S.editId=id||null;S.formErr='';
  S.form=p?{name:p.name,type:p.type,pct:p.pct,target:p.target,desc:p.desc,period:p.period,terms:p.terms,active:p.active}:{name:'',type:'pct',pct:10,target:'cat:Coffee',desc:'',period:'',terms:'',active:true};
  S.modal='promo';render();
}

   S.modal=null;save();render();toast('Promo disimpan.');},
 viewOrder:function(el){S.orderId=+el.dataset.id;S.modal='order';render();},
 advance:function(el){var o=S.orders.filter(function(x){return x.id===+el.dataset.id;})[0],n={Diproses:'Siap',Siap:'Selesai'}[o.status];if(!n)return;o.status=n;o.log[n]=Date.now();save();render();toast('Status pesanan #'+o.id+' diperbarui.');},
 checkPay:function(el){var o=S.orders.filter(function(x){return x.id===+el.dataset.id;})[0];settlePaid(o);save();render();toast('Penyedia pembayaran melaporkan: berhasil (simulasi).');},
 saveSet:function(){S.settings.fee=Math.max(0,Math.round(+S.settings.fee)||0);save();render();toast('Pengaturan disimpan.');},
 resetDemo:function(){try{localStorage.removeItem(KEY);}catch(e){}var f=fresh();S.menu=f.menu;S.promos=f.promos;S.orders=f.orders;S.settings=f.settings;S.cart=[];S.seq=f.seq;S.trx=f.trx;S.draftId=null;render();toast('Data demo disetel ulang.');}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var f=ACT[el.dataset.act];if(f)f(el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&S.modal){S.modal=null;render();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('article[data-act="open"]')){e.preventDefault();ACT.open(e.target);}
});
function onBind(e){
  var el=e.target;if(!el.dataset||!el.dataset.bind)return;
  if(el.type==='radio'&&e.type==='input')return;
  var val=el.type==='checkbox'?el.checked:el.value;
  setPath(el.dataset.bind,val);
  if(el.dataset.bind==='settings.delivery'||el.dataset.bind.indexOf('settings.')===0)save();
  if(el.dataset.live==='menu'){$('#menuGrid').innerHTML=menuGridHTML();}
  else if(el.dataset.live==='menuAdm'){$('#menuTbl').innerHTML=menuTblHTML();}
  else if(el.dataset.live==='ord'){$('#ordTbl').innerHTML=ordTblHTML();}
  if(el.dataset.rerender&&e.type==='change')render();
}
document.addEventListener('input',onBind);
document.addEventListener('change',onBind);
document.addEventListener('submit',function(e){
  var f=e.target.getAttribute('data-form');if(!f)return;
  e.preventDefault();
  if(f==='homeSearch'){S.q=$('#homeQ').value;S.cat='Semua';go('menu');}
  else if(f==='track'){
    var n=+($('#trackNo').value.replace(/\D/g,''));
    var o=S.orders.filter(function(x){return x.id===n;})[0];
    if(!o){S.trackErr='Nomor pesanan tidak ditemukan. Periksa kembali nomornya.';render();return;}
    S.trackErr='';S.viewOrderId=o.id;S.showDetail=false;go('status');
  }
  else if(f==='login'){
    if(S.login.email.trim().toLowerCase()==='admin@nyaweed.id'&&S.login.pass==='nyaweed123'){S.auth=true;S.loginErr='';S.aview='dashboard';render();}
    else{S.loginErr='Email atau password salah.';render();}
  }
});
render();
})();
</script>

</body></html>
